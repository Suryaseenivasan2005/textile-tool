services:
  - type: web
    name: tex-tool-backend
    runtime: node
    rootDir: ./backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: BUILD
      - key: JWT_SECRET
        scope: BUILD
      - key: MONGODB_URI
        scope: BUILD

  - type: web
    name: tex-tool-frontend
    runtime: node
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    startCommand: npm preview
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://tex-tool-backend.render.com
